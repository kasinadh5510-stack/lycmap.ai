kind = "web"
previewPath = "/"
title = "lycmap.ai"
version = "1.0.0"
id = "artifacts/lycmap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25341

[services.development]
run = "pnpm --filter @workspace/lycmap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lycmap", "run", "build" ]
serve = "static"
publicDir = "artifacts/lycmap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25341"
BASE_PATH = "/"
